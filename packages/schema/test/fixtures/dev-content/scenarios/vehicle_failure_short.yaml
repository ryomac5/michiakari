# 開発用のダミー。開発者の知見ではない。本番の判断には使わない
# すべて架空。文面は自作

id: vehicle_failure_short
title:
  ja: 朝の車両故障、現場の処置で短時間に再開する
  en: Morning train malfunction fixed on the spot, quick resumption
event_type: vehicle_failure
operator: 京阪電気鉄道
line: 京阪本線
blocked_section:
  from_station: 枚方市
  to_station: 中書島
start_time: "2026-11-06T07:30:00+09:00"

# 通勤途中。9時までに祇園四条に着きたい。代替経路は知っている
# 枚方市から京都へ向かう鉄道は京阪本線だけ。他社線へ回ると淀川を渡って大きく遠回りになる
user:
  current_station: 枚方市
  destination: 祇園四条
  constraints:
    deadline: "09:00"
    knows_alternatives: true
    mobility_notes: null
  language: ja

timeline:
  - id: obs_1
    offset_minutes: 0
    kind: announcement
    text:
      ja: 京阪本線は、石清水八幡宮駅〜淀駅間を走行中の列車で車両の不具合が発生したため、枚方市駅〜中書島駅間で運転を見合わせています。現在、車両の点検を行っています。
      en: The Keihan Main Line is suspended between Hirakatashi and Chushojima due to a malfunction on a train between Iwashimizu-hachimangu and Yodo. The train is being inspected.
  - id: obs_2
    offset_minutes: 7
    kind: station_broadcast
    text:
      ja: お客様にお知らせします。ただいま運転士が車両の点検と処置を行っております。しばらくお待ちください。
      en: Attention passengers. The driver is inspecting and fixing the train. Please wait a moment.
  - id: obs_3
    offset_minutes: 15
    kind: announcement
    text:
      ja: 車両の点検が終わりました。安全を確認したうえで、7時55分頃に運転を再開する見込みです。
      en: Inspection of the train is complete. After safety checks, service is expected to resume at around 7:55.
  - id: obs_4
    offset_minutes: 21
    kind: announcement
    text:
      ja: 京阪本線は、7時56分に運転を再開しました。列車に遅れが出ています。
      en: The Keihan Main Line resumed at 7:56. Trains are running with delays.

expectations:
  # obs_1 と obs_2 の期待は hold と wait から switch に変えた（2026-11-07）。理由は README.md
  - after: obs_1
    action: switch
    break_even_shown: true
    note: 規則では車両の故障は長く止まる。統計値の再開の見込みが期限の境目より後なので、期限に間に合う手段へ切り替える。
  - after: obs_2
    action: switch
    note: 現場の処置の放送は再開が近い手がかりにならない。見込みは変わらないので、切り替えを続ける。
  - after: obs_3
    action: wait
    note: 点検終了と再開見込みが出た。他社線へ回るより早く着き、9時にも間に合うので待つ。

ground_truth:
  resume_offset_minutes: 21
  notes: 7時56分に運転を再開した。待った人は8時30分ごろに祇園四条に着いた。他社線へ回った人は9時に間に合わなかった。
